<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Side View Samples</title>
    <style>
      :root {
        color: #17130f;
        background: #f7f0e4;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        padding: 18px;
      }

      h1,
      h2 {
        margin: 0;
      }

      h1 {
        font-size: 28px;
        line-height: 1;
      }

      h2 {
        margin-top: 24px;
        font-size: 18px;
      }

      p {
        color: #6f675e;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }

      figure {
        margin: 0;
        border: 1px solid rgba(23, 19, 15, 0.14);
        border-radius: 8px;
        overflow: hidden;
        background: #fffaf1;
      }

      img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        display: block;
      }

      figcaption {
        padding: 9px;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.25;
      }
    </style>
  </head>
  <body>
    <h1>Side View Samples</h1>
    <p>20 пробников: 10 людей и 10 манекенов.</p>

    <h2>People</h2>
    <div class="grid">
      <figure><img src="people/low-taper-oval-left.png" alt="" /><figcaption>low taper oval left</figcaption></figure>
      <figure><img src="people/low-taper-oval-right.png" alt="" /><figcaption>low taper oval right</figcaption></figure>
      <figure><img src="people/textured-crop-round-stubble-left.png" alt="" /><figcaption>textured crop round left</figcaption></figure>
      <figure><img src="people/textured-crop-round-stubble-right.png" alt="" /><figcaption>textured crop round right</figcaption></figure>
      <figure><img src="people/modern-side-part-square-short-beard-left.png" alt="" /><figcaption>side part square left</figcaption></figure>
      <figure><img src="people/modern-side-part-square-short-beard-right.png" alt="" /><figcaption>side part square right</figcaption></figure>
      <figure><img src="people/soft-flow-long-none-left.png" alt="" /><figcaption>soft flow long left</figcaption></figure>
      <figure><img src="people/soft-flow-long-none-right.png" alt="" /><figcaption>soft flow long right</figcaption></figure>
      <figure><img src="people/classic-scissor-oval-full-beard-left.png" alt="" /><figcaption>classic scissor beard left</figcaption></figure>
      <figure><img src="people/classic-scissor-oval-full-beard-right.png" alt="" /><figcaption>classic scissor beard right</figcaption></figure>
    </div>

    <h2>Mannequins</h2>
    <div class="grid">
      <figure><img src="mannequins/low-taper-oval-left.png" alt="" /><figcaption>low taper oval left</figcaption></figure>
      <figure><img src="mannequins/low-taper-oval-right.png" alt="" /><figcaption>low taper oval right</figcaption></figure>
      <figure><img src="mannequins/textured-crop-round-left.png" alt="" /><figcaption>textured crop round left</figcaption></figure>
      <figure><img src="mannequins/textured-crop-round-right.png" alt="" /><figcaption>textured crop round right</figcaption></figure>
      <figure><img src="mannequins/modern-side-part-square-left.png" alt="" /><figcaption>side part square left</figcaption></figure>
      <figure><img src="mannequins/modern-side-part-square-right.png" alt="" /><figcaption>side part square right</figcaption></figure>
      <figure><img src="mannequins/soft-flow-long-left.png" alt="" /><figcaption>soft flow long left</figcaption></figure>
      <figure><img src="mannequins/soft-flow-long-right.png" alt="" /><figcaption>soft flow long right</figcaption></figure>
      <figure><img src="mannequins/classic-scissor-oval-full-beard-left.png" alt="" /><figcaption>classic scissor beard left</figcaption></figure>
      <figure><img src="mannequins/classic-scissor-oval-full-beard-right.png" alt="" /><figcaption>classic scissor beard right</figcaption></figure>
    </div>
  </body>
</html>
